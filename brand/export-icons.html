<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Exportar íconos de Pesito</title>
</head>
<body>
<p>Exportador local de íconos. Abrir con el servidor de desarrollo y llamar a <code>exportIcons()</code>.</p>
<script>
// Rasteriza los SVG de la marca a los PNG que consume la PWA. Sin red ni dependencias.
const SOURCES = [
  { name: 'icon-192.png', src: '../favicon.svg', size: 192 },
  { name: 'icon-512.png', src: '../favicon.svg', size: 512 },
  { name: 'apple-touch-icon.png', src: '../favicon.svg', size: 180 },
  { name: 'icon-maskable-512.png', src: './pesito-maskable.svg', size: 512 },
];

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('No se pudo cargar ' + src));
    img.src = new URL(src, location.href).href;
  });
}

async function exportIcons() {
  const result = {};
  for (const { name, src, size } of SOURCES) {
    const img = await loadImage(src);
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, size, size);
    result[name] = canvas.toDataURL('image/png');
  }
  return result;
}

window.exportIcons = exportIcons;
</script>
</body>
</html>
